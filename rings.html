<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Debug Super Mode</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #debug-console {
            position: absolute; top: 0; left: 0; width: 100%; height: 60%;
            background: rgba(0, 0, 0, 0.8); color: #00ff00;
            font-family: monospace; font-size: 11px;
            overflow-y: scroll; z-index: 1000; padding: 10px;
            pointer-events: none; word-wrap: break-word;
        }
        #ui-container {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 10; gap: 20px;
        }
        .arrow-btn {
            background: rgba(255, 255, 255, 0.8); border: none; border-radius: 50%;
            width: 50px; height: 50px; font-size: 24px;
        }
        #input_video { display: none; }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transform: scaleX(-1); }
    </style>
</head>
<body>

    <div id="debug-console">=== SUPER LOG v2 ===<br></div>

    <video id="input_video" playsinline muted autoplay></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-container">
        <button class="arrow-btn" id="prev-btn">◀</button>
        <button class="arrow-btn" id="next-btn">▶</button>
    </div>

    <script>
        const debugDiv = document.getElementById('debug-console');
        window.superLog = function(msg, color = '#0f0') {
            const line = document.createElement('div');
            line.innerText = `> ${msg}`;
            line.style.color = color;
            debugDiv.appendChild(line);
            console.log(msg);
        }

        // Ловим глобальные ошибки загрузки скриптов
        window.addEventListener('error', function(event) {
            window.superLog(`GLOBAL ERROR: ${event.message}`, 'red');
            window.superLog(`File: ${event.filename}, Line: ${event.lineno}`, 'red');
            return false;
        });

        // Ловим ошибки невыполненных промисов
        window.addEventListener('unhandledrejection', function(event) {
            window.superLog(`PROMISE ERROR: ${event.reason}`, 'red');
        });

        window.superLog("Logger initialized. Waiting for modules...");
    </script>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
        import { GLTFLoader } from 'https://unpkg.com/three@0.128.0/examples/jsm/loaders/GLTFLoader.js';
        import { Hands } from 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js';
        import { Camera } from 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js';

        window.superLog("Modules imported successfully!");

        // === НАСТРОЙКИ ===
        const models = ['ring_01.glb', 'ring_02.glb', 'ring_03.glb'];
        // =================

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        
        let currentModelIndex = 0;
        let currentRing = null;

        try {
            window.superLog("Initializing Three.js...");
            const scene = new THREE.Scene();
            const camera3D = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera3D.position.z = 2;

            const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(0, 10, 10);
            scene.add(directionalLight);

            window.superLog("Three.js OK. Loading models...");

            const loader = new GLTFLoader();
            function loadRing(index) {
                window.superLog(`Loading: ${models[index]}`);
                if (currentRing) { scene.remove(currentRing); currentRing = null; }
                
                loader.load(models[index], (gltf) => {
                    window.superLog("Model loaded!");
                    currentRing = gltf.scene;
                    currentRing.scale.set(15, 15, 15);
                    scene.add(currentRing);
                }, undefined, (err) => {
                    window.superLog(`Model load ERROR: ${err.message}`, 'orange');
                    const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
                    const mat = new THREE.MeshNormalMaterial();
                    currentRing = new THREE.Mesh(geo, mat);
                    scene.add(currentRing);
                    window.superLog("Created fallback Cube", 'yellow');
                });
            }
            loadRing(0);

            window.superLog("Setting up MediaPipe...");
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults((results) => {
                renderer.autoClear = false;
                renderer.clear();
                
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    const p13 = landmarks[13];
                    const p14 = landmarks[14];
                    
                    if (currentRing) {
                        const x = -((p13.x + p14.x) / 2 - 0.5) * 10;
                        const y = -((p13.y + p14.y) / 2 - 0.5) * 10;
                        currentRing.position.set(x, y, -5);
                        
                        const dx = (p14.x - p13.x);
                        const dy = (p14.y - p13.y);
                        currentRing.rotation.z = -Math.atan2(dy, dx) + Math.PI/2;
                    }
                }
                renderer.render(scene, camera3D);
            });

            window.superLog("Requesting Camera...");
            
            navigator.mediaDevices.getUserMedia({ video: true })
                .then((stream) => {
                    window.superLog("Camera Access GRANTED");
                    stream.getTracks().forEach(track => track.stop());
                    
                    const camera = new Camera(videoElement, {
                        onFrame: async () => {
                            await hands.send({image: videoElement});
                        },
                        width: 1280,
                        height: 720
                    });
                    
                    camera.start()
                        .then(() => window.superLog("Camera Utility Started!"))
                        .catch(e => window.superLog(`Camera Util Error: ${e.message}`, 'red'));
                })
                .catch((err) => {
                    window.superLog(`CAMERA DENIED: ${err.message}`, 'red');
                });

            // Кнопки
            document.getElementById('next-btn').onclick = () => {
                currentModelIndex = (currentModelIndex + 1) % models.length;
                loadRing(currentModelIndex);
            };
            document.getElementById('prev-btn').onclick = () => {
                currentModelIndex = (currentModelIndex - 1 + models.length) % models.length;
                loadRing(currentModelIndex);
            };

        } catch (e) {
            window.superLog(`CRITICAL ERROR: ${e.message}`, 'red');
        }
    </script>
</body>
</html>
