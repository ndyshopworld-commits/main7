<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dragon Scale Model – AlbaSpace Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Define colour variables consistent with the rest of the site -->
  <style>
    :root {
      --header-bg: #020617;
      --accent: #00c2ff;
      --page-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #4b5563;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--page-bg);
      color: var(--text-main);
    }
  </style>
  <link rel="stylesheet" href="../assets/css/shop.css" />
  <script src="../assets/js/cart.js" defer></script>
</head>
<body>
  <!-- Header replicates the look of the site with logo, nav and cart icon -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="header-logo" style="text-decoration:none;color:inherit;">
        <span style="font-weight:700;font-size:18px;letter-spacing:0.08em;">AlbaSpace</span>
      </a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
      </nav>
      <div class="cart-icon">
        <a href="cart.html" aria-label="View cart" style="color:inherit;position:relative;display:inline-flex;align-items:center;">
          <svg viewBox="0 0 24 24" stroke-width="1.6" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 3h2l2.68 10.74a2 2 0 0 0 2 1.54h8.96a2 2 0 0 0 2-1.54L21 6H6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="9" cy="21" r="1" fill="currentColor" />
            <circle cx="19" cy="21" r="1" fill="currentColor" />
          </svg>
          <span class="cart-count">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="product-page">
    <div class="product-detail">
      <img src="../assets/images/dragon.png" alt="Dragon Scale Model" />
      <div class="detail-info">
        <h1>Dragon Scale Model</h1>
        <div class="product-price">$300.00</div>
        <ul class="product-details">
          <li>1:48 scale replica of the iconic crew capsule</li>
          <li>Approximately 4.5″ tall</li>
          <li>Approximately 500 grams</li>
          <li>Base inscribed with vehicle names</li>
          <li>Magnetic base</li>
        </ul>
        <div class="quantity-selector">
          <button type="button" id="qty-minus">–</button>
          <span id="qty-value">1</span>
          <button type="button" id="qty-plus">+</button>
        </div>
        <button class="btn-primary" id="add-to-cart">Add to Cart</button>
      </div>
    </div>
  </main>

  <footer class="footer" style="background:var(--header-bg);color:#d1d5db;padding:26px 20px;font-size:13px;">
    <div class="footer-grid" style="max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
      <div class="footer-logo" style="display:flex;align-items:center;gap:12px;">
        <span style="font-weight:600;font-size:16px;">AlbaSpace</span>
      </div>
      <div class="footer-right" style="text-align:right;">
        <p>&copy; 2025 AlbaSpace. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Page‑specific script to handle quantity and cart operations -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const minusBtn = document.getElementById('qty-minus');
      const plusBtn = document.getElementById('qty-plus');
      const qtyDisplay = document.getElementById('qty-value');
      const addBtn = document.getElementById('add-to-cart');
      let qty = 1;
      function updateDisplay() {
        qtyDisplay.textContent = qty;
      }
      minusBtn.addEventListener('click', function () {
        if (qty > 1) {
          qty--;
          updateDisplay();
        }
      });
      plusBtn.addEventListener('click', function () {
        qty++;
        updateDisplay();
      });
      addBtn.addEventListener('click', function () {
        // Add item to cart using the global cartManager
        cartManager.addToCart({
          id: 'dragon-model',
          name: 'Dragon Scale Model',
          price: 300.00,
          image: '../assets/images/dragon.png',
          quantity: qty
        });
        // Provide user feedback by briefly updating button text
        const original = addBtn.textContent;
        addBtn.textContent = 'Added!';
        setTimeout(() => { addBtn.textContent = original; }, 1200);
      });
    });
  </script>
</body>
</html>
